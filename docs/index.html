<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100">
    <div class="my-16 flex flex-col max-w-md mx-auto px-4 min-w-fit">
        <div class="flex justify-center bg-indigo-600 p-5 text-white rounded-t-xl">
            <h1 class="text-2xl font-bold">ToDo App</h1>
        </div>
        <div class="bg-white p-5 rounded-b-xl">
            <form id="todo-form" action="" class="flex justify-between gap-5 mb-2">
                <input id="todo-input" class="border-2 w-2xs p-1 rounded-sm border-violet-700" placeholder="Enter task description..." type="text">
                
                <button id="todo-button" class="bg-violet-700 text-white px-3 py-1 rounded-full hover:-translate-y-0.5  hover:bg-violet-800 transition-all duration-200" type="submit">Add</button>
            </form>
            <p id="error-msg" class="hidden text-red-500">Task required!</p>
            <div class="flex justify-between gap-5 p-3 border-b">
                <p id="todo-task"></p>
                <p id="todo-completion"></p>
            </div>
            <ul id="todo-list" class="p-3">

            </ul>
            <p id="edit-error" class="hidden text-red-500 p-5">can't mark complete while editing!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
